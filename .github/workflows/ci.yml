name: Test and publish website
on:
  push:
    branches: [main, sgt-design-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pages
      - name: Build and check the production container
        run: |
          docker build -t sgt-holding:ci .
          node scripts/check-container.mjs sgt-holding:ci
      - name: Upload tested Pages build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/sgt-design-preview'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/sgt-design-preview'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
