name: sgt-holding
services:
  app:
    build: .
    image: sgt-holding:local
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /app/var
      TRUST_PROXY: '1'
    volumes:
      - partner_data:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      NO_PROXY: app,localhost,127.0.0.1
      no_proxy: app,localhost,127.0.0.1
      SITE_DOMAIN: ${SITE_DOMAIN:?Create .env.production first}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  partner_data:
  certificates:
  caddy_config:
